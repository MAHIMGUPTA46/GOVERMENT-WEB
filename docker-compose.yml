version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Redis Pub/Sub & Shared Event Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: paimana-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # PAIMANA AI Full-Stack Application (Express + Vite + WebSocket Server)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paimana-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - REALTIME_ENABLED=true
      - REALTIME_TRANSPORT=websocket
      - REDIS_URL=redis://redis:6379/0
      - REALTIME_CHANNEL_PREFIX=paimana:realtime
      - REALTIME_HEARTBEAT_SECONDS=25
      - REALTIME_MAX_CONNECTIONS_PER_USER=5
      - REALTIME_RECONNECT_MAX_SECONDS=60
      - WS_TOKEN_SECRET=paimana-production-secure-hmac-token-secret-2026
      # Public browser-facing variables (never private docker hostnames):
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:3000/api/v1/realtime/ws
      - VITE_SSE_URL=http://localhost:3000/api/v1/realtime/events
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy with WebSocket Upgrades
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: paimana-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  redis_data:
