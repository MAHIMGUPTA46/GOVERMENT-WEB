# ==============================================================================
# PAIMANA AI - Production Reverse Proxy Configuration (Nginx)
# Architecture: MoSPI IPMD Predictive Infrastructure Decision Support Platform
# Hardened WebSocket, SSE Fallback, REST API and HTTP/2 SSL Terminating Proxy
# ==============================================================================

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Map connection upgrade header for WebSocket reverse proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_app {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name paimana.mospi.gov.in *.run.app localhost;

        # Redirect plain HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Direct handling for container / load balancer environments
        location / {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ======================================================================
        # 1. Primary WebSocket Real-Time Bus Upgrade Path
        # WS /api/v1/realtime/ws -> WSS in production
        # ======================================================================
        location /api/v1/realtime/ws {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            # Critical WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep connection alive (prevent proxy idle timeouts across 24h)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 60s;

            # Disable proxy buffering for immediate full-duplex transmission
            proxy_buffering off;
            proxy_cache off;
        }

        # ======================================================================
        # 2. Server-Sent Events (SSE) Fallback Stream
        # GET /api/v1/realtime/events
        # ======================================================================
        location /api/v1/realtime/events {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE Requirements: disable buffering & chunks caching
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Prevent nginx GZIP from compressing active SSE event-streams
            gzip off;
        }

        # ======================================================================
        # 3. REST API Routes & Polling Fallback
        # ======================================================================
        location /api/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Security Headers & CORS
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
    }
}
